<!DOCTYPE html><html>
<head>  <!-- Google Analytics -->  <script async src="https://www.googletagmanager.com/gtag/js?id=G-35N6J0GV0G"></script>  <script>

  </script>  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asupan Malam</title>  <link rel="icon" type="image/png" href="favicon.png">  <style>
    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    header {
      background: #1a1a1a;
      padding: 15px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 15px;
      padding: 15px;
    }

    .card {
      background: #222;
      border-radius: 10px;
      overflow: hidden;
    }

    .thumbnail-wrap {
      position: relative;
      width: 100%;
      background: #000;
    }

    .card img {
      width: 100%;
      display: block;
    }

    .duration-badge {
      position: absolute;
      right: 6px;
      bottom: 6px;
      background: rgba(0, 0, 0, 0.85);
      color: white;
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      line-height: 1.3;
    }

    .card h3 {
      font-size: 14px;
      padding: 10px;
      margin: 0;
    }

    #pagination button {
      padding: 8px 12px;
      margin: 4px;
      cursor: pointer;
    }

    #pagination span {
      display: inline-block;
      margin: 8px;
    }
  </style></head><body>  <header>
    <a href="index.html"
       style="color:white;text-decoration:none;">
      Asupan Malam
    </a>
  </header>  <div style="padding:15px;">
    <input
      type="text"
      id="search"
      placeholder="Cari video..."
      autocomplete="off"
      style="
        width:100%;
        padding:12px;
        border:none;
        border-radius:8px;
        box-sizing:border-box;
        font-size:16px;
      "
    >
  </div>  <div class="grid" id="videos"></div>  <div id="pagination" style="text-align:center;padding:20px;"></div>  <script>
    let allVideos = [];
    let filteredVideos = [];

    let currentPage = 1;
    let totalPages = 1;

    let searchPage = 1;
    let searchMode = false;

    let videosPerPage = 20;
    let allVideosPromise = null;

    // Mengubah durasi menjadi format menit:detik atau jam:menit:detik
    function formatDuration(value) {
      if (value === null || value === undefined || value === "") {
        return "";
      }

      // Jika API sudah memberikan format seperti 12:35
      if (typeof value === "string" && value.includes(":")) {
        const parts = value.split(":");

        if (
          parts.every(part => /^\d+$/.test(part)) &&
          parts.length >= 2 &&
          parts.length <= 3
        ) {
          return parts.map(part => part.padStart(2, "0")).join(":");
        }

        return "";
      }

      // Jika durasi berupa angka dalam satuan detik
      const seconds = Number(value);

      if (!Number.isFinite(seconds) || seconds < 0) {
        return "";
      }

      const totalSeconds = Math.floor(seconds);
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const remainingSeconds = totalSeconds % 60;

      if (hours > 0) {
        return (
          hours + ":" +
          String(minutes).padStart(2, "0") + ":" +
          String(remainingSeconds).padStart(2, "0")
        );
      }

      return (
        minutes + ":" +
        String(remainingSeconds).padStart(2, "0")
      );
    }

    // Memuat halaman video biasa
    async function loadVideos(page = 1) {
      try {
        searchMode = false;
        currentPage = page;

        const response = await fetch(`/api/video?page=${page}`);

        if (!response.ok) {
          throw new Error("Gagal mengambil data video");
        }

        const data = await response.json();

        if (!data.result || !Array.isArray(data.result.files)) {
          throw new Error("Format data video tidak sesuai");
        }

        allVideos = data.result.files;
        totalPages = Number(data.result.total_pages) || 1;

        if (page === 1 && allVideos.length > 0) {
          videosPerPage = allVideos.length;
        }

        renderVideos(allVideos);
        renderPagination();

      } catch (err) {
        document.getElementById("videos").innerHTML =
          "<h2>Gagal memuat video</h2>";

        console.error(err);
      }
    }

    // Mengambil video dari seluruh halaman API
    async function fetchAllVideos() {
      if (allVideosPromise) {
        return allVideosPromise;
      }

      allVideosPromise = (async () => {
        const firstResponse = await fetch("/api/video?page=1");

        if (!firstResponse.ok) {
          throw new Error("Gagal mengambil halaman pertama");
        }

        const firstData = await firstResponse.json();

        if (
          !firstData.result ||
          !Array.isArray(firstData.result.files)
        ) {
          throw new Error("Data video tidak valid");
        }

        const pages = Number(firstData.result.total_pages) || 1;

        let videos = [...firstData.result.files];

        if (videos.length > 0) {
          videosPerPage = videos.length;
        }

        // Mengambil halaman berikutnya secara berurutan
        for (let page = 2; page <= pages; page++) {
          const response = await fetch(`/api/video?page=${page}`);

          if (!response.ok) {
            throw new Error("Gagal mengambil halaman " + page);
          }

          const data = await response.json();

          if (!data.result || !Array.isArray(data.result.files)) {
            throw new Error("Data halaman " + page + " tidak valid");
          }

          videos = videos.concat(data.result.files);
        }

        return videos;
      })();

      try {
        return await allVideosPromise;
      } catch (err) {
        allVideosPromise = null;
        throw err;
      }
    }

    // Menampilkan daftar video beserta durasinya
    function renderVideos(videos) {
      const container = document.getElementById("videos");

      container.innerHTML = "";

      if (!videos.length) {
        container.innerHTML =
          "<p style='padding:10px;'>Video tidak ditemukan.</p>";
        return;
      }

      videos.forEach(video => {
        const link = document.createElement("a");

        link.href =
          "watch.html?code=" + encodeURIComponent(video.file_code);

        link.style.textDecoration = "none";
        link.style.color = "white";

        const card = document.createElement("div");
        card.className = "card";

        // Bungkus thumbnail agar label durasi berada di pojok
        const thumbnailWrap = document.createElement("div");
        thumbnailWrap.className = "thumbnail-wrap";

        const img = document.createElement("img");
        img.src = video.single_img || "";
        img.alt = video.title || "Video";
        img.loading = "lazy";

        thumbnailWrap.appendChild(img);

        // Ambil durasi dari data API
        const duration = formatDuration(video.length);

        if (duration) {
          const durationBadge = document.createElement("span");
          durationBadge.className = "duration-badge";
          durationBadge.textContent = duration;
          thumbnailWrap.appendChild(durationBadge);
        }

        const title = document.createElement("h3");
        title.textContent = video.title || "Tanpa judul";

        card.appendChild(thumbnailWrap);
        card.appendChild(title);

        link.appendChild(card);
        container.appendChild(link);
      });
    }

    // Pagination untuk daftar video biasa dan hasil pencarian
    function renderPagination() {
      const container = document.getElementById("pagination");

      let page;
      let pages;

      if (searchMode) {
        page = searchPage;

        pages = Math.max(
          1,
          Math.ceil(filteredVideos.length / videosPerPage)
        );
      } else {
        page = currentPage;
        pages = totalPages;
      }

      let html = "";

      if (page > 1) {
        html += `
          <button id="prevButton">← Prev</button>
        `;
      }

      html += `
        <span>Halaman ${page} / ${pages}</span>
      `;

      if (page < pages) {
        html += `
          <button id="nextButton">Next →</button>
        `;
      }

      container.innerHTML = html;

      const prev = document.getElementById("prevButton");
      const next = document.getElementById("nextButton");

      if (prev) {
        prev.addEventListener("click", () => {
          if (searchMode) {
            showSearchPage(searchPage - 1);
          } else {
            loadVideos(currentPage - 1);
          }
        });
      }

      if (next) {
        next.addEventListener("click", () => {
          if (searchMode) {
            showSearchPage(searchPage + 1);
          } else {
            loadVideos(currentPage + 1);
          }
        });
      }
    }

    // Menampilkan satu halaman hasil pencarian
    function showSearchPage(page) {
      const pages = Math.max(
        1,
        Math.ceil(filteredVideos.length / videosPerPage)
      );

      searchPage = Math.min(Math.max(1, page), pages);

      const start = (searchPage - 1) * videosPerPage;
      const results = filteredVideos.slice(
        start,
        start + videosPerPage
      );

      renderVideos(results);
      renderPagination();
    }

    // Melakukan pencarian pada seluruh halaman API
    let searchTimer;

    document.getElementById("search").addEventListener("input", event => {
      clearTimeout(searchTimer);

      const keyword = event.target.value.trim().toLowerCase();

      searchTimer = setTimeout(async () => {
        if (!keyword) {
          searchMode = false;
          loadVideos(1);
          return;
        }

        searchMode = true;
        searchPage = 1;

        document.getElementById("videos").innerHTML =
          "<p style='padding:10px;'>Sedang mencari video...</p>";

        document.getElementById("pagination").innerHTML = "";

        try {
          const videos = await fetchAllVideos();

          // Mengabaikan hasil pencarian lama jika kata kunci berubah
          const latestKeyword = document
            .getElementById("search")
            .value.trim()
            .toLowerCase();

          if (latestKeyword !== keyword) {
            return;
          }

          filteredVideos = videos.filter(video =>
            String(video.title || "")
              .toLowerCase()
              .includes(keyword)
          );

          showSearchPage(1);

        } catch (err) {
          document.getElementById("videos").innerHTML =
            "<p style='padding:10px;'>Pencarian gagal. Silakan coba lagi.</p>";

          console.error(err);
        }
      }, 300);
    });

    // Memuat halaman pertama ketika website dibuka
    loadVideos(1);
  </script></body>
</html>
